enb1:
    enb_ip: 10.0.1.2
    mcc: 244
    mnc: 08
    sync: gps
    enb_eif: EIF1
    sync_output_pps: EnabledWithoutBtsInputReference
    sync_output_pps_backplane: EnabledWithoutBtsInputReference
    cells:
        1..9:
            pci: ${ID}
            tac: 123
            earfcn: 42000
            ch_bw: 20 MHz
            p_max: 370
            dl_mimo_mode: TXDiv
            qrxlevminintra_f: -130
            qrxlevmin: -100
            tddFrameConf: 2
            bbpool: 1
            channels:
              - {direction: TX, radio: '${ID}', port: 1}
              - {direction: RX, radio: '${ID}', port: 1}
              - {direction: TX, radio: '${ID}', port: 2}
              - {direction: RX, radio: '${ID}', port: 2}
              - {direction: TX, radio: '${ID}', port: 3}
              - {direction: RX, radio: '${ID}', port: 3}
              - {direction: TX, radio: '${ID}', port: 4}
              - {direction: RX, radio: '${ID}', port: 4}
              - {direction: TX, radio: '${ID}', port: 5}
              - {direction: RX, radio: '${ID}', port: 5}
              - {direction: TX, radio: '${ID}', port: 6}
              - {direction: RX, radio: '${ID}', port: 6}
              - {direction: TX, radio: '${ID}', port: 7}
              - {direction: RX, radio: '${ID}', port: 7}
              - {direction: TX, radio: '${ID}', port: 8}
              - {direction: RX, radio: '${ID}', port: 8}
    radios:
        1..9:
            type: AZQP
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF', 'OFF', 'OFF', 'OFF', 'OFF']
            link_speed: eCpri25
            bbmod: 1
            port: ${ID}
            protocol_type: eCPRI
            second_endpoint_port_id: 1
            iq_compression: eCPRI IQ9_E7
    bbmods:
        1:
            type: ABIO
            bb_card_usage: 2
            smod: 1
            port: 1
    smods:
        1:
            type: ASIB
