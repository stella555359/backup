enb1:
    enb_ip: 10.0.1.2
    mcc: 244
    mnc: 08
    sync: gps
    enb_eif: EIF1
    cells:
        1..3:
            pci: ${ID}
            tac: 123
            earfcn_dl: 800
            ch_bw: 10 MHz
            p_max: 370
            dl_mimo_mode: Dynamic Open Loop MIMO
            qrxlevminintra_f: -130
            qrxlevmin: -100
            channels:
              - {direction: TX, radio: '${ID}', port: 1}
              - {direction: RX, radio: '${ID}', port: 1}
              - {direction: TX, radio: '${ID}', port: 2}
              - {direction: RX, radio: '${ID}', port: 2}
    radios:
        1..3:
            type: AHFB
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            protocol_type: CPRI
            smod: 1
            port: ${ID}
    smods:
        1:
            type: ASOF
