enb1:
    enb_ip: 10.0.1.2
    mcc: 244
    mnc: 08
    sync: gps
    enb_eif: EIF1
    sync_output_pps: EnabledWithoutBtsInputReference
    sync_output_pps_backplane: EnabledWithoutBtsInputReference
    sbs_total: 20000
    cells:
        1..36:
            pci: ${ID}
            tac: 123
            earfcn_dl: 800
            ch_bw: 10 MHz
            p_max: 370
            dl_mimo_mode: Dynamic Open Loop MIMO
            qrxlevminintra_f: -130
            qrxlevmin: -100
            channels:
              - {direction: TX, radio: '${ID}', port: 1}
              - {direction: RX, radio: '${ID}', port: 1}
              - {direction: TX, radio: '${ID}', port: 2}
              - {direction: RX, radio: '${ID}', port: 2}
    radios:
        1..12:
            type: AHFB
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            protocol_type: CPRI
            bbmod: 1
            port: ${ID}
        13..24:
            type: AHFB
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            protocol_type: CPRI
            second_endpoint_port_id: 1
            bbmod: 2
            port: ${ID - 12}
        25..36:
            type: AHFB
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            protocol_type: CPRI
            second_endpoint_port_id: 1
            bbmod: 3
            port: ${ID - 24}
    bbmods:
        1:
            type: ABIP
            bb_card_usage: 2
            smod: 1
            port: 1
        2:
            type: ABIP
            bb_card_usage: 2
            smod: 1
            port: 2
        3:
            type: ABIP
            bb_card_usage: 2
            smod: 1
            port: 3
    smods:
        1:
            type: ASIB

