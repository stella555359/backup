enb1:
    enb_ip: 10.0.1.2
    mcc: 244
    mnc: 08
    sync: gps
    enb_eif: EIF1
    sync_output_pps: EnabledWithoutBtsInputReference
    sync_output_pps_backplane: EnabledWithoutBtsInputReference
    sbs_total: 20000
    cells:
        1..9:
            pci: ${ID}
            tac: 124
            earfcn_dl: 1400
            ch_bw: 10 MHz
            p_max: 400
            dl_mimo_mode: Dynamic Open Loop MIMO
            qrxlevminintra_f: -90
            qrxlevmin: -90
            bbpool: 1
            channels:
              - {direction: TX, radio: '${ID}', port: 1}
              - {direction: RX, radio: '${ID}', port: 1}
              - {direction: TX, radio: '${ID}', port: 2}
              - {direction: RX, radio: '${ID}', port: 2}
        10..18:
            pci: ${ID}
            tac: 124
            earfcn_dl: 1400
            ch_bw: 10 MHz
            p_max: 400
            dl_mimo_mode: Dynamic Open Loop MIMO
            qrxlevminintra_f: -90
            qrxlevmin: -90
            bbpool: 2
            channels:
              - {direction: TX, radio: '${ID}', port: 1}
              - {direction: RX, radio: '${ID}', port: 1}
              - {direction: TX, radio: '${ID}', port: 2}
              - {direction: RX, radio: '${ID}', port: 2}
    radios:
        1..9:
            type: AHEH
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            bbmod: 1
            port: ${ID}
            protocol_type: CPRI
        10..15:
            type: AHEH
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            bbmod: 2
            port: ${ID - 9}
        16..18:
            type: AHEH
            antennas:
                dc_voltage: ['OFF', 'OFF', 'OFF', 'OFF']
            link_speed: Cpri7
            bbmod: 3
            port: ${ID - 12}

    bbmods:
        3:
            bb_card_usage: 2
            type: ABIA
            smod: 1
            port: 1
        2:
            bb_card_usage: 2
            type: ABIA
            smod: 1
            port: 2
        1:
            bb_card_usage: 2
            type: ABIO
            smod: 1
            port: 3
    smods:
        1:
            type: ASIM
