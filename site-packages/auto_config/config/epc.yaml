################################################################################
# EPC Configuration
################################################################################

mme1:
    s1_addr         : default # 10.254.221.<tlid>
    mmegi           : 1
    mmec            : 3
    supported_plmn  : [244-08, 666-14, 555-12]

sgw1:
    s1u_addr        : default # 10.254.221.<tlid>
    s11_addr        : default # 10.254.221.<tlid>

pgw1:
    pgw_addr        : 30.61.255.254
    pgw_addr_mask   : 16
    apn             : nokia1.net
    tgrs_gw_addresses : 184.1.1.254

pgw2:
    pgw_addr        : 30.62.255.254
    pgw_addr_mask   : 16
    apn             : nokia2.net
    tgrs_gw_addresses : 184.1.1.254

mme_proxy:
    ctrl_ip     : default # mmesym1.lab0.krk-lab.nsn-rdnet.net
    ctrl_port   : default # 50000 + <tlid>

mme_proxy_s1:
    ctrl_ip     : default # mmesym1.lab0.krk-lab.nsn-rdnet.net
    ctrl_port   : default # 60000 + <tlid>

uesim_ip_configuration:
    workstation_ip_addr : default # 10.60.0.1
    netmask             : default # 255.255.255.0
    lte_network_gw      : default # 184.1.1.254

# NOTE: Cloud config is applied dynamically in run-time:
# {mme1}->{s1_addr}  = '10.0.1.1';
# {sgw1}->{s1u_addr} = '10.0.1.1';
# {sgw1}->{s11_addr} = '10.0.1.1';
# {mme_proxy}->{ctrl_ip}    = 127.0.0.1;
# {mme_proxy_s1}->{ctrl_ip} = 127.0.0.1;
# {uesim_ip_configuration}->{workstation_ip_addr} = 10.0.2.1;

