################################################################################
# UE Configuration
################################################################################

UE_AUTN : 000102030405060708090a0b0c0d0e0f
UE_RAND : 01020304050607080910111213141516

# UE supported keys:
# (M) ueid      : UE id in the form of ueid_start:ueid_stop, eg: 301:307.
#                 Total UEs created = ueid_stop - ueid_start + 1
# (M) mcc       : Mobile Country Code                       |   IMSI
# (M) mnc       : Mobile Network Code                       |-- (International Mobile Subscriber Identity)
# (M) (*) msin  : Mobile Subscription Identification Number |   IMSI = mcc + mnc + msin
# (O) (*) ip    : IP of the default bearer, with qci=9
# (O) ipver     : IP version (default=ipv4)
# (O) pmi       : Pre-coding Matrix Indicator (default=1)
# (O) ri        : Rank Indicator (default=2)
# (O) cqi       : Channel Quality Indicator (default=15)
# (M) profile   : name of the profile from uecap.ini file
# (M) bearer    : name of bearer set from section above
# (O) eia       : EPS Integrity Algorithms (default=NULL)
# (O) eea       : EPS Encryption Algorithms (default=NULL)
# (O) pool      : name of the ue pool in ue.db file (default=NULL)
# (O) connected_to : enb cell that UE is connected to
#
# (*): The values marked with stars are auto-incremented for each ueid.
#      If the value is not provided in the UE section, then the current value is equal
#      to the last value from previous UE entry plus 1.
# (M): Mandatory
# (O): Optional
#
####################################################
#   To generate entry in config files, following keys must exist:
#   - for hardware.rtv: name and connected_to
#   - for epc.cfg:
#       profile and pool: UE is added as lmts
#       all others: UE is added as external
#   - for ue.db: all UEs are added
####################################################

ue:
  -
    ueid    : 1-1000
    mcc     : 244
    mnc     : 08
    msin    : 8723000001
    eea     : AES
    eia     : AES
    bearer  : bearer_set_2
    ip      : 30.61.0.1
    cat     : 5
    profile : basic

################################################################################
# LMTS Configuration
################################################################################

lmts1:
    enb: 1
    cell: [1, 2]
    host_ip: default # wmp-tl<tlid>.lab0.krk-lab.nsn-rdnet.net
    ctrl_ip: default # 10.60.0.11 = enb_nr * 10 + min(cell_id)

lmts2:
    enb: 1
    cell: 3
    host_ip: default # wmp-tl<tlid>.lab0.krk-lab.nsn-rdnet.net
