################################################################################
# ENB Configuration
################################################################################
enb1:
    enb_ip  : default # 10.254.192.<tlid> or 10.0.1.2 for cloud
    mcc     : 244
    mnc     : 08
    sync    : gps # gpsf, topf, topp
    cells   :
      -
        id  : 1
        tac : 123
        earfcn_dl : 800
        radio     : FXFA
        antennas :
            - 1
            - 3
      -
        id  : 2
        tac : 123
        earfcn_dl : 2175
        radio     : FRIG
        antennas :
            - 1
            - 2
      -
        id  : 3
        tac : 123
        earfcn_dl : 2525
        radio     : FXCA
        antennas :
            - 1
            - 3

enb2:
    enb_ip  : default # 10.254.192.<tlid> or 10.0.1.4 for cloud
    mcc     : 666
    mnc     : 14
    sync    : gps # gpsf, topf, topp
    cells   :
      -
        id  : 1
        tac : 123
        earfcn_dl : 800
        radio     : FXFA
        antennas :
            - 1
            - 3
      -
        id  : 2
        tac : 123
        earfcn_dl : 2275
        radio     : FRIG
        antennas :
            - 1
            - 2
