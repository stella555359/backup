#        radio     : FRGP


################################################################################
#   Faked eNBs
################################################################################

enb101:
    type    : simulated
    enb_ip  : 10.254.222.<tlid>
    mcc     : 244
    mnc     : 08
    x2_peers : none
    cells   :
      -
        id  : 1
        tac : 123
        earfcn_dl : 2800
        bw  : 10MHz
    utran_rnc :
        id      : 12
        rnc_id  : 255
        lac     : 1
    utran_cell :
        id  : 1
        rnc : 12
        pci : 255
        uarfcn  : 9842:9842
        cell_identity_utran : 1
        rac : 1

enb102:
    type    : simulated:pico
    enb_ip  : 10.254.222.<tlid>
    mcc     : 244
    mnc     : 08
    x2_peers : 2
    cells   :
      -
        id  : 1
        tac : 123
        earfcn_dl : 150
        bw  : 20MHz
    enb_param :
        mlbSupportedRelease : r9
        mlb_feature_flag    : on
        eicic_feature_flag  : on
    enb_cell_param :
        id  : 1
        usable_abs_pattern_info : 0x00,0x00,0x00,0x00,0x00

